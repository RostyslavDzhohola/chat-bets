<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Bets · Stream Overlay</title>
  <style>
    :root { color-scheme: dark; --ink: #f6f4ff; --muted: #a9a5c2; --line: rgba(255,255,255,.12); --purple: #ad77ff; --cyan: #5cffe4; --pink: #ff77bd; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: transparent; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    body { padding: clamp(16px, 2vw, 40px); }
    .layout { width: min(920px, 100%); display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(240px, .8fr); gap: 14px; filter: drop-shadow(0 20px 38px rgba(0,0,0,.35)); }
    .panel { background: linear-gradient(145deg, rgba(24,20,45,.96), rgba(13,13,30,.94)); border: 1px solid rgba(189,156,255,.25); box-shadow: inset 0 1px rgba(255,255,255,.08); backdrop-filter: blur(20px); border-radius: 24px; }
    .main { padding: 25px 28px 23px; position: relative; overflow: hidden; }
    .main::before { content: ''; position: absolute; width: 260px; height: 260px; right: -100px; top: -150px; border-radius: 50%; background: #8d46ed; filter: blur(85px); opacity: .25; pointer-events: none; }
    .top, .meta, .choice-head, .footer, .person, .call { display:flex; justify-content:space-between; align-items:center; gap: 12px; }
    .brand { color: var(--cyan); font-size: 13px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
    .brand b { color: var(--ink); margin-right: 8px; font-size: 16px; letter-spacing: 0; }
    .status { display:inline-flex; gap: 7px; align-items:center; padding: 7px 11px; border-radius: 999px; background: rgba(92,255,228,.12); color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing:.08em; text-transform:uppercase; }
    .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
    .status.locked { background: rgba(255,198,93,.13); color: #ffd681; }
    .status.resolved { background: rgba(173,119,255,.18); color: #c9a8ff; }
    h1 { font-size: clamp(28px, 2.8vw, 43px); line-height: 1.13; letter-spacing: -.04em; margin: 29px 0 19px; max-width: 620px; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    .timer { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 900; letter-spacing:-.03em; }
    .boost-banner { display:inline-flex; align-items:center; margin:-6px 0 18px; padding:7px 11px; border-radius:9px; color:#ffe6a9; background:rgba(255,198,93,.14); border:1px solid rgba(255,198,93,.28); font-size:11px; font-weight:900; letter-spacing:.08em; }
    .boost-banner[hidden] { display:none; }
    .choices { display: grid; gap: 13px; }
    .choice { position:relative; overflow:hidden; border:1px solid var(--line); border-radius: 14px; background:rgba(255,255,255,.035); padding: 13px 15px 11px; }
    .choice.win { border-color: var(--cyan); box-shadow: 0 0 18px rgba(92,255,228,.18); }
    .choice-head { font-size: 17px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
    .choice-head span:last-child { font-variant-numeric: tabular-nums; }
    .bar { height: 12px; border-radius: 50px; background: rgba(255,255,255,.09); overflow:hidden; }
    .fill { height:100%; width:0; border-radius: inherit; background: linear-gradient(90deg, #8f5cff, #cf8fff); transition: width .8s ease; }
    .choice:nth-child(even) .fill { background:linear-gradient(90deg, #23cfba, #75ffe8); }
    .choice small { display:block; margin-top:8px; color: var(--muted); font-size:11px; }
    .footer { border-top:1px solid var(--line); margin-top:22px; padding-top:16px; font-size: 12px; color: var(--muted); }
    .command { color: var(--ink); font-weight:800; background:rgba(173,119,255,.2); border:1px solid rgba(173,119,255,.25); border-radius:7px; padding:5px 8px; }
    .side { padding: 22px 19px 17px; display:flex; flex-direction:column; gap:16px; }
    .section-title { color:var(--muted); font-size:11px; letter-spacing:.15em; text-transform:uppercase; font-weight:900; margin-bottom:11px; }
    .people, .calls { display:grid; gap: 9px; }
    .person { font-size:13px; min-width:0; }
    .person .name, .call .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rank { color:var(--purple); font-weight:900; width:19px; flex:none; }
    .points { color:var(--cyan); font-weight:900; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .divider { border-top:1px solid var(--line); }
    .call { font-size:12px; color:var(--muted); }
    .call strong { color:var(--ink); font-weight:800; text-transform:uppercase; }
    .call em { color:#ffe6a9; font-size:10px; font-style:normal; font-weight:900; margin-left:4px; }
    .event { margin-top:auto; padding:10px 11px; border-radius:11px; background:rgba(173,119,255,.12); color:#dac6ff; font-size:11px; line-height:1.35; }
    .empty { color:var(--muted); font-size:12px; }
    @media(max-width:700px) { .layout { grid-template-columns:1fr; } .side { display:grid; grid-template-columns:1fr 1fr; } .side .divider { display:none; } .event { grid-column:1/-1; } }
  </style>
</head>
<body>
  <main class="layout" aria-label="Chat Bets prediction overlay">
    <section class="panel main">
      <div class="top"><div class="brand"><b>✦</b>CHAT BETS</div><div id="status" class="status">Waiting</div></div>
      <h1 id="question">Prediction incoming…</h1>
      <div class="meta"><span id="round">PLAY POINTS · NO REAL MONEY</span><span id="timer" class="timer">--:--</span></div>
      <div id="doubleDown" class="boost-banner" hidden>⚡ DOUBLE DOWN · 1 BOOSTED CALL</div>
      <div id="choices" class="choices"></div>
      <div class="footer"><span>Make your call in chat</span><span id="command" class="command">!call yes</span></div>
    </section>
    <aside class="panel side">
      <div><div class="section-title">🏆 &nbsp; Top predictors</div><div id="leaderboard" class="people"><span class="empty">Leaderboard starts with the first call</span></div></div>
      <div class="divider"></div>
      <div><div class="section-title">⚡ &nbsp; Latest calls</div><div id="calls" class="calls"><span class="empty">Waiting for chat…</span></div></div>
      <div id="event" class="event">Waiting for the next prediction</div>
    </aside>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let state = null, clockOffset = 0;
    const escape = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function render() {
      if (!state) return;
      const round = state.round;
      $('question').textContent = round?.question || 'Prediction incoming…';
      $('round').textContent = round ? `ROUND #${round.id}  ·  ${round.calls.length} CALL${round.calls.length === 1 ? '' : 'S'}  ·  PLAY POINTS` : 'PLAY POINTS · NO REAL MONEY';
      $('status').textContent = round ? round.phase : 'Waiting';
      $('status').className = `status ${round?.phase || ''}`;
      $('command').textContent = round ? `!call ${round.options[0]}` : '!call yes';
      const boosts = round?.calls.filter(item => item.doubled).length || 0;
      $('doubleDown').hidden = boosts === 0;
      $('doubleDown').textContent = `⚡ DOUBLE DOWN · ${boosts} BOOSTED CALL${boosts === 1 ? '' : 'S'}`;
      $('choices').innerHTML = state.totals.map(item => `<div class="choice ${round?.winner === item.option ? 'win' : ''}"><div class="choice-head"><span>${escape(item.option)}</span><span>${item.percent}%</span></div><div class="bar"><div class="fill" style="width:${item.percent}%"></div></div><small>${item.calls} call${item.calls === 1 ? '' : 's'} · ${item.points} play points</small></div>`).join('');
      $('leaderboard').innerHTML = state.leaderboard.map((item, index) => `<div class="person"><span class="rank">${String(index + 1).padStart(2, '0')}</span><span class="name">${escape(item.user)}</span><span class="points">${item.points} pts</span></div>`).join('') || '<span class="empty">Leaderboard starts with the first call</span>';
      $('calls').innerHTML = state.lastCalls.map(item => `<div class="call"><span class="name">${escape(item.user)}</span><strong>${escape(item.option)}${item.doubled ? '<em>×2</em>' : ''}</strong></div>`).join('') || '<span class="empty">Waiting for chat…</span>';
      $('event').textContent = state.event;
      updateClock();
    }
    function updateClock() {
      const round = state?.round;
      if (!round) return void ($('timer').textContent = '--:--');
      if (round.phase !== 'open') return void ($('timer').textContent = round.phase === 'locked' ? 'LOCKED' : 'FINAL');
      const seconds = Math.max(0, Math.ceil((round.closesAt - (Date.now() + clockOffset)) / 1000));
      $('timer').textContent = `${String(Math.floor(seconds / 60)).padStart(2,'0')}:${String(seconds % 60).padStart(2,'0')}`;
    }
    function connect() {
      const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
      socket.onmessage = event => { const next = JSON.parse(event.data); if (next.type === 'state') { clockOffset = next.serverNow - Date.now(); state = next; render(); } };
      socket.onclose = () => setTimeout(connect, 1500);
    }
    connect(); setInterval(updateClock, 250);
  </script>
</body>
</html>
